name: Generate signing key (run once)

# IMPORTANT: only run this in a PRIVATE repository.
# Save the values from the artifact into repository Secrets, then delete the artifact.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        shell: bash
        run: |
          STORE_PASS="$(openssl rand -base64 24)"
          KEY_PASS="$(openssl rand -base64 24)"
          ALIAS="bloomgram"
          keytool -genkeypair -v \
            -keystore bloomgram.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=BloomGram, OU=Personal, O=Personal, L=Unknown, ST=Unknown, C=US"
          {
            echo "KEYSTORE_BASE64=$(base64 -w0 bloomgram.jks)"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } > keystore-bundle.txt
          echo "Keystore generated. SHA-256:"
          sha256sum bloomgram.jks

      - name: Upload bundle (delete after saving secrets)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle-DELETE-AFTER-SAVING
          path: keystore-bundle.txt
          retention-days: 1
