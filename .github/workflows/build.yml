name: Build BloomGram

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to assemble'
        required: true
        default: 'fullAfatRelease'
        type: choice
        options:
          - fullAfatRelease
          - liteAfatRelease
          - fullAfatDebug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch git submodules
        shell: bash
        run: |
          python3 - <<'PY'
          import configparser, os, subprocess
          pins = {
              'TMessagesProj/jni/td': '022d60202e446ad1287b9fb68e687c8a0760788b',
              'TMessagesProj/jni/tgcalls': '545f5ae599f8282e1ae3f38aaff166d179d75703',
              'TMessagesProj/jni/third_party/absl': '54fac219c4ef0bc379dfffb0b8098725d77ac81b',
              'TMessagesProj/jni/third_party/boost-regex': '4cbcd3078e6ae10d05124379623a1bf03fcb9350',
              'TMessagesProj/jni/third_party/boringssl': '2b44a3701a4788e1ef866ddc7f143060a3d196c9',
              'TMessagesProj/jni/third_party/dav1d': '54706fc6bc0cdecab7e9593974a4039cc038fca7',
              'TMessagesProj/jni/third_party/ffmpeg': '8dca1586f468bfcbb78ae3ed618af1361d9f140a',
              'TMessagesProj/jni/third_party/libprisma': '94640c63c20eacdf70e37e23198d9ab53c802ebd',
              'TMessagesProj/jni/third_party/libvpx': '6df3ec34557879fff673706f4a1d9fbd0f3a6f0e',
              'TMessagesProj/jni/third_party/libyuv': '28ce69c2744a6aafdb58564e7b884aec3f66be5f',
              'TMessagesProj/jni/third_party/openh264': '652bdb7719f30b52b08e506645a7322ff1b2cc6f',
              'TMessagesProj/jni/third_party/wamr': '25bd7eb63e828e4bd242cc9b38d260b4b31c6605',
              'TMessagesProj/jni/third_party/xiph/ogg': 'be05b13e98b048f0b5a0f5fa8ce514d56db5f822',
              'TMessagesProj/jni/third_party/xiph/opus': '22244de5a79bd1d6d623c32e72bf1954b56235be',
              'TMessagesProj/jni/third_party/xiph/opusfile': 'a55c164e9891a9326188b7d4d216ec9a88373739',
              'TMessagesProj/jni/tlottie': '31f1b542f88e7b4be9a01e749920d857535fc715',
              'TMessagesProj/jni/twidget/twidget': '4769d72c5c5a9bace3c7bd8b6308cb79bc150bab',
              'TMessagesProj/jni/twidget/widget-sandbox': 'c498cefddefaba765282c9f3ab0b330f4bc990f6',
              'TMessagesProj/jni/wallet-engine': '5c65e47cb8d68727c20d89382d0bc51292486b9a',
              'TMessagesProj/lib/jlatexmath': '919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed',
              'TMessagesProj_Modules/media': '09b6c97c0d691c50cd4541e1573995d4066d6f5c',
          }
          cp = configparser.ConfigParser()
          cp.read('.gitmodules')
          for section in cp.sections():
              path = cp[section]['path']
              url = cp[section]['url']
              os.makedirs(path, exist_ok=True)
              if os.listdir(path):
                  print('already present:', path)
                  continue
              print('cloning', path, 'from', url, flush=True)
              subprocess.run(['git', 'clone', '--depth', '1', '--recurse-submodules', url, path], check=True)
              sha = pins.get(path)
              if sha:
                  subprocess.run(['git', '-C', path, 'fetch', '--depth', '1', 'origin', sha], check=True)
                  subprocess.run(['git', '-C', path, 'checkout', sha], check=True)
                  subprocess.run(['git', '-C', path, 'submodule', 'update', '--init', '--recursive', '--depth', '1'], check=True)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 (ChaquoPy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.0.3"

      - name: Alias Android 37.2 platform as 37
        shell: bash
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.2" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configure local.properties
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore signing key
        shell: bash
        run: |
          mkdir -p TMessagesProj/config
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/exteraGram.jks
          test -s TMessagesProj/config/exteraGram.jks

      - name: Restore Firebase config
        shell: bash
        run: |
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > TMessagesProj/google-services.json
          python3 -c "import json; json.load(open('TMessagesProj/google-services.json'))"

      - name: Write API_KEYS
        shell: bash
        run: |
          cat > API_KEYS <<EOF
          APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH="${{ secrets.TELEGRAM_APP_HASH }}"
          MAPS_V2_API="${{ secrets.MAPS_V2_API }}"
          SIGNING_KEY_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Inject GitHub token for badge auto-publish
        shell: bash
        env:
          GH_PAT_A: ${{ secrets.BLOOM_PAT_A }}
          GH_PAT_B: ${{ secrets.BLOOM_PAT_B }}
        run: |
          mkdir -p TMessagesProj/src/main/res/values
          cat > TMessagesProj/src/main/res/values/bloomgram_secrets.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="GithubToken">${GH_PAT_A}${GH_PAT_B}</string>
          </resources>
          EOF

      - name: Prepare Gradle
        shell: bash
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: false

      - name: Build APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VARIANT="${{ inputs.variant }}"
          TASK="assemble$(python3 -c "import sys; v=sys.argv[1]; print(v[0].upper()+v[1:])" "$VARIANT")"
          echo "Running ./gradlew $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bloomgram-${{ inputs.variant }}
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
